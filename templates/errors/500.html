{% extends "base.html" %}

{% block title %}Server Error (500) | VeriText.ai{% endblock %}

{% block content %}
<div class="container" style="padding: 5rem 0; text-align: center;">
  <div class="glass-card" style="max-width: 540px; margin: 0 auto; padding: 3.5rem 2rem;">
    <div style="font-size: 4rem; font-weight: 800; font-family: var(--font-mono); color: #f87171; line-height: 1; margin-bottom: 1rem;">
      500
    </div>

      Back to Checker
    </a>
  </div>
</div>
{% endblock %}
